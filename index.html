<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ispsdpeplano</title>
    <meta name="description" content="Plataforma unificada para indicadores estratégicos, projeções acadêmicas e conformidade normativa do ISPS." />
    <meta property="og:title" content="ispsdpeplano" />
    <meta property="og:description" content="Plataforma unificada para indicadores estratégicos, projeções acadêmicas e conformidade normativa do ISPS." />

    <script>
      (function() {
        function isIgnorableError(err) {
          if (!err) return false;
          var str = "";
          try {
            str = (err.message || err.reason || err.stack || String(err) || "").toLowerCase();
          } catch(e) {
            str = "";
          }
          return (
            str.indexOf("internal assertion failed") !== -1 ||
            str.indexOf("unexpected state") !== -1 ||
            str.indexOf("quota limit exceeded") !== -1 ||
            str.indexOf("free daily read units") !== -1 ||
            str.indexOf("resource-exhausted") !== -1 ||
            str.indexOf("resource_exhausted") !== -1 ||
            str.indexOf("could not reach cloud firestore") !== -1 ||
            str.indexOf("backend didn't respond") !== -1 ||
            str.indexOf("client will operate in offline mode") !== -1 ||
            str.indexOf("@firebase/firestore") !== -1 ||
            str.indexOf("firestore (11.") !== -1
          );
        }

        window.addEventListener("error", function(e) {
          if (isIgnorableError(e.error) || isIgnorableError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener("unhandledrejection", function(e) {
          if (isIgnorableError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isIgnorableError(msg) || isIgnorableError(err)) {
            return true;
          }
          if (typeof origOnError === "function") {
            return origOnError.apply(this, arguments);
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050b38; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid rgba(255,184,0,0.2); border-top-color: #FFB800; border-radius: 50%; animation: sigepSpin 0.9s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.05em; color: #ffffff; text-transform: uppercase;">A Carregar SIGEP ISPS</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Sistema Integrado de Gestão de Processos</div>
        <style>@keyframes sigepSpin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
